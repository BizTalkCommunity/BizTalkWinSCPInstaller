name: Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - tomcanter/**

jobs:
  validation:
    name: Run Validation Gates
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Pester 5
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -MinimumVersion 5.0.0 -Force -SkipPublisherCheck

      - name: Install PSScriptAnalyzer
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module PSScriptAnalyzer -Scope CurrentUser -MinimumVersion 1.21.0 -Force -SkipPublisherCheck

      - name: Run validation script
        shell: pwsh
        run: |
          ./scripts/Run-Validation.ps1 -FailOnCoverageTarget
